<!DOCTYPE html>
<html>
<head>
    <title>Register - Secure Login System</title>
</head>

<body>

    <h1>Create Account</h1>

    <form method="POST">

        <label>Username:</label>
        <br>

        <input
            type="text"
            name="username"
            minlength="3"
            maxlength="30"
            required
        >

        <br><br>

        <label>Password:</label>
        <br>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >

        <br><br>

        <button type="submit">Register</button>

    </form>

    <br>

    <a href="/login">Already have an account? Login</a>

    <br><br>

    <a href="/">Home</a>

</body>
</html>
